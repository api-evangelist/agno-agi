description: >-
  FinOps view of Agno spend. The open-source Agno framework and self-hosted
  AgentOS runtime carry no Agno license fee - cost in that model is your own
  compute for running AgentOS plus whatever LLM provider(s) you call from
  your agents, teams, and workflows. Agno the company's own invoice is a flat
  monthly subscription for the hosted os.agno.com Control Plane (Pro/
  Enterprise), priced by seats and live connections rather than by usage,
  runs, or tokens.
notes: >-
  The dominant real-world cost of running Agno is almost always the
  underlying model provider bill (tokens consumed by agent/team/workflow
  runs), plus your own infrastructure for AgentOS and its database/vector
  store - neither of which appears on an Agno invoice. Track those spends in
  the relevant model provider's and cloud provider's FinOps data separately.
