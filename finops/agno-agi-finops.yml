meters:
- name: control_plane_subscription
  description: Flat monthly Pro subscription fee for the hosted Control Plane (includes 4 seats, 1 live connection).
  unit: subscriptions
  aggregation: sum
  dimensions:
  - account
- name: control_plane_seats
  description: Additional Control Plane seats beyond the 4 included with Pro.
  unit: seats
  aggregation: sum
  dimensions:
  - account
- name: control_plane_live_connections
  description: Additional live AgentOS connections beyond the 1 included with Pro.
  unit: connections
  aggregation: sum
  dimensions:
  - account
  - deployment
- name: self_hosted_compute
  description: Infrastructure cost of running the self-hosted AgentOS service and its database (no Agno invoice).
  unit: hours
  aggregation: sum
  dimensions:
  - deployment
- name: model_provider_spend
  description: Token/request spend billed directly by whichever LLM provider(s) an agent, team, or workflow is configured to call. Not billed by Agno.
  unit: tokens
  aggregation: sum
  dimensions:
  - agent
  - team
  - workflow
  - model_provider
principles:
- name: Visibility
  description: Track Control Plane seats/connections on the Agno invoice separately from AgentOS infrastructure costs and downstream model provider token spend.
- name: Allocation
  description: Name agents, teams, and workflows per product/team so model provider token spend maps to internal cost centers even though it never appears on Agno's own bill.
- name: Optimization
  description: Right-size AgentOS infrastructure (self-hosted), consolidate seats/connections on the Control Plane, and choose cost-appropriate model providers per agent.
- name: Accountability
  description: Assign an owner per AgentOS deployment and per Control Plane account; review monthly seat/connection usage against Pro allowances before adding paid add-ons.
